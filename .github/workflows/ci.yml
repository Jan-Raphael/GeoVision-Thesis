name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  UV_VERSION: "0.12.3"

jobs:
  # ---------------------------------------------------------------------------
  # The "no TensorFlow" constraint is a hard project rule (see CLAUDE.md and
  # 01-Architecture/Tech-Stack.md). It runs first and standalone so a violation
  # is unmistakable rather than buried in a lint log.
  # ---------------------------------------------------------------------------
  constraints:
    name: Project constraints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Assert TensorFlow / Keras absent
        run: python scripts/check_no_tensorflow.py

  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend (dev extras)
        working-directory: backend
        run: uv sync --extra dev --frozen

      - name: ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: ruff format --check
        working-directory: backend
        run: uv run ruff format --check .

      - name: mypy
        working-directory: backend
        run: uv run mypy app

      - name: import-linter (architecture boundaries)
        working-directory: backend
        run: uv run lint-imports

  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geovision
          POSTGRES_PASSWORD: geovision
          POSTGRES_DB: geovision_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U geovision"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GV_ENVIRONMENT: ci
      GV_JWT_SECRET_KEY: ci-only-secret-not-used-anywhere-else
      GV_POSTGRES_HOST: localhost
      GV_POSTGRES_PORT: "5432"
      GV_POSTGRES_USER: geovision
      GV_POSTGRES_PASSWORD: geovision
      GV_POSTGRES_DB: geovision_test
      GV_REDIS_HOST: localhost
      GV_REDIS_PORT: "6379"
      GV_S3_ENDPOINT_URL: http://localhost:9000
      GV_S3_ACCESS_KEY: ci
      GV_S3_SECRET_KEY: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend (dev extras)
        working-directory: backend
        run: uv sync --extra dev --frozen

      - name: pytest (unit + integration)
        working-directory: backend
        run: uv run pytest --cov=app --cov-report=xml --cov-report=term-missing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  test-ai:
    name: AI package tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # CPU wheels only — the CUDA build is ~2.5 GB and pointless on a CI runner.
      - name: Install ai (dev extras, CPU torch)
        working-directory: ai
        run: uv sync --extra dev --frozen

      - name: ruff check
        working-directory: ai
        run: uv run ruff check .

      - name: pytest
        working-directory: ai
        run: uv run pytest

  frontend:
    name: Dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install
        working-directory: dashboard
        run: npm ci

      - name: Type check (strict)
        working-directory: dashboard
        run: npm run typecheck

      - name: Lint
        working-directory: dashboard
        run: npm run lint

      - name: Build
        working-directory: dashboard
        run: npm run build

  compose:
    name: Compose file validity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate dev stack definition
        run: |
          cp .env.example .env
          docker compose -f docker/docker-compose.dev.yml config --quiet
          echo "compose file is valid"
