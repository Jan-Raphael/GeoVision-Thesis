# Module 07 training recipe for MobileNetV3 — the comparison model, trained under identical
# conditions to train_resnet18.yaml so the backbone comparison table means something.
# See Module-07-Classifier-Training.md. CLI flags (--epochs, --device, ...) override these.

arch: mobilenetv3
processed_root: ../dataset/processed
run_root: ../outputs/runs
epochs: 60
frozen_epochs: 3
batch_size: 32
lr_head: 3.0e-4
lr_backbone: 3.0e-5
weight_decay: 1.0e-4
label_smoothing: 0.05
patience: 10
lr_patience: 4
lr_factor: 0.5
device: auto
seed: 42
num_workers: 0
