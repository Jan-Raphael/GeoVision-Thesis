# GeoVision — public reverse proxy (Module 16).
#
# The one container actually exposed to the outside world. Terminates TLS,
# then routes:
#   /health, /health/ready, /api/*, /pair  -> backend  (includes /api/v1/ws)
#   everything else                        -> dashboard (static SPA)
#
# /pair is the phone/webcam pairing page (app/api/v1/routers/mobile_pair.py) —
# unprefixed on the backend, same reasoning as /health, so it needs its own
# location here too; without this it falls through to the dashboard's SPA
# catch-all and 404s.
#
# Certs are read from /etc/nginx/certs/{fullchain,privkey}.pem, mounted from
# ./docker/certs/ on the host (gitignored — see DEPLOYMENT.md for how to
# generate a free, self-signed one for local/demo use, or point this at a
# real cert once there's a domain — Cloudflare Tunnel, Q4, needs no cert here
# at all since it terminates TLS itself).

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/css application/javascript application/json;

    # Matches GV_MAX_ASSET_UPLOAD_BYTES (25 MB) with headroom. A mismatch here
    # produces a confusing 413 from nginx before the backend's own limit ever
    # gets a chance to return its clearer error — keep the two in step.
    client_max_body_size 30m;

    # Upgrade the connection only for requests that actually asked for it.
    # Sending "Connection: upgrade" unconditionally on every /api/ request
    # (plain REST calls included) breaks proxy keep-alive for all of them —
    # a subtler version of the exact WebSocket-through-nginx trap this file's
    # header block below exists to avoid.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS, not a static `upstream {}` block. `upstream {}`
    # resolves its server's IP once, at nginx startup, and never again — so
    # any container restart (a `deploy-up` after a code change, a crash
    # recovery, anything) leaves nginx holding a dead IP and returning 502
    # "connect() failed (Connection refused)" until nginx itself is manually
    # restarted. Found running this compose file for real: `backend` restarted
    # once during testing and every request through nginx broke instantly.
    # A `resolver` + a variable in `proxy_pass` makes nginx re-resolve the
    # hostname (respecting this TTL) instead of caching it forever.
    resolver 127.0.0.11 valid=10s;

    # Plain HTTP just redirects — nothing meaningful should ever be served
    # unencrypted, including the ESP32's own uploads.
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /health {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location /pair {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
        }

        location /api/ {
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Required for /api/v1/ws — omitting these makes WebSocket fail
            # silently behind the proxy while working fine in dev, a classic
            # late-stage surprise (Module-16-Deployment.md's own warning).
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
        }

        location / {
            set $dashboard_upstream http://dashboard:80;
            proxy_pass $dashboard_upstream;
            proxy_set_header Host $host;
        }
    }
}
