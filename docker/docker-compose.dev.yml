# GeoVision — local development infrastructure
#
# This file starts ONLY the backing services. The API, worker, and dashboard run
# on the host with hot reload, which is far faster to iterate on than rebuilding
# images. The full containerised stack (nginx, backend, worker, dashboard) is
# built in Module 16 as docker-compose.yml.
#
#   .\dev.ps1 up        (Windows)
#   make up             (Linux/macOS/WSL)
#
# Credentials come from ../.env — generate it first with:
#   python scripts/generate_secrets.py

name: geovision-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: geovision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GV_POSTGRES_USER:-geovision}
      POSTGRES_PASSWORD: ${GV_POSTGRES_PASSWORD:?set GV_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${GV_POSTGRES_DB:-geovision}
      # Every timestamp in this project is UTC (Domain-Model.md). Pinning the
      # server clock removes an entire class of "off by 8 hours" bugs.
      TZ: UTC
      PGTZ: UTC
    ports:
      # Host 5433 -> container 5432: Windows dev machines frequently already
      # run PostgreSQL on 5432, and the clash surfaces as a baffling auth error.
      - "${GV_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GV_POSTGRES_USER:-geovision} -d ${GV_POSTGRES_DB:-geovision}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: geovision-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --loglevel warning
    ports:
      - "${GV_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: geovision-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${GV_S3_ACCESS_KEY:-geovision}
      MINIO_ROOT_PASSWORD: ${GV_S3_SECRET_KEY:?set GV_S3_SECRET_KEY in .env}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console  ->  http://localhost:9001
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Bucket bootstrap.
  #
  # MinIO starts with no buckets, so without this the very first image upload in
  # Module 05 fails with NoSuchBucket. This one-shot container creates the
  # bucket, then exits — `docker compose ps` showing it as "exited (0)" is the
  # expected steady state, not a failure.
  # ---------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: geovision-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      BUCKET: ${GV_S3_BUCKET:-geovision}
      ACCESS_KEY: ${GV_S3_ACCESS_KEY:-geovision}
      SECRET_KEY: ${GV_S3_SECRET_KEY:?set GV_S3_SECRET_KEY in .env}
    entrypoint: >
      /bin/sh -c "
      set -e;
      mc alias set local http://minio:9000 $${ACCESS_KEY} $${SECRET_KEY};
      mc mb --ignore-existing local/$${BUCKET};
      mc mb --ignore-existing local/$${BUCKET}-test;
      mc anonymous set none local/$${BUCKET};
      echo 'bucket ready:' $${BUCKET};
      "
    restart: "no"

volumes:
  postgres_data:
    name: geovision_postgres_data
  redis_data:
    name: geovision_redis_data
  minio_data:
    name: geovision_minio_data
