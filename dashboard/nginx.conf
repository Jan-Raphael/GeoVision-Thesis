# Internal static-file server for the dashboard container (Module 16).
#
# Not the public-facing proxy — that's docker/nginx.conf, one layer out, which
# terminates TLS and forwards non-API requests here. This one only needs to
# serve the built SPA correctly.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build filenames (Vite's default) never change contents, so a long
    # cache is safe; index.html itself must always be revalidated or a
    # deployed update never reaches a returning visitor's browser.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        # SPA fallback: a hard refresh on /projects/abc123 must still resolve
        # to index.html and let React Router take over, not 404 against a
        # literal file that was never built.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
