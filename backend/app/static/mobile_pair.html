<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>GeoVision — Pair this device</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #0f172a;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 16px;
    padding: 28px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  h1 {
    font-size: 1.15rem;
    margin: 0 0 4px;
  }
  .subtitle { color: #64748b; font-size: 0.9rem; margin: 0 0 20px; }
  .pill {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 0.75rem;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .pill-ok { background: #dcfce7; color: #166534; }
  .pill-wait { background: #e0f2fe; color: #075985; }
  .pill-err { background: #fee2e2; color: #991b1b; }
  .device-box {
    background: #f8fafc;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }
  .device-box .name { font-weight: 600; font-size: 1rem; }
  .device-box .meta { color: #64748b; font-size: 0.85rem; margin-top: 2px; }
  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
  }
  .btn-primary {
    width: 100%;
    padding: 16px;
    font-size: 1.05rem;
    font-weight: 600;
    background: #0f172a;
    color: white;
  }
  .btn-primary:disabled { opacity: 0.55; cursor: default; }
  .btn-secondary {
    width: 100%;
    padding: 12px;
    font-size: 0.9rem;
    font-weight: 500;
    background: #f1f5f9;
    color: #0f172a;
    margin-top: 10px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    font-size: 1rem;
    border: 1px solid #cbd5e1;
    border-radius: 10px;
    margin-bottom: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .status-line {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    color: #475569;
    margin: 14px 0;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid #cbd5e1;
    border-top-color: #0f172a;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex: none;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #991b1b;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.88rem;
    margin-bottom: 14px;
  }
  .success-box {
    background: #f0fdf4;
    border: 1px solid #bbf7d0;
    color: #166534;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .hint { color: #94a3b8; font-size: 0.78rem; margin-top: 16px; text-align: center; }
  #file-input { display: none; }
</style>
</head>
<body>
  <div class="card" id="app">
    <h1>GeoVision device pairing</h1>
    <p class="subtitle">Use this phone (or any camera) as a construction site capture device.</p>
    <div id="content"><div class="status-line"><span class="spinner"></span>Loading…</div></div>
  </div>

  <input type="file" id="file-input" accept="image/*" capture="environment" />

<script>
"use strict";

/* -----------------------------------------------------------------------
 * Pure-JS SHA-256 / HMAC-SHA256.
 *
 * NOT the Web Crypto API (window.crypto.subtle) on purpose: SubtleCrypto is
 * only available in "secure contexts" (HTTPS, or http://localhost) - a phone
 * on the same Wi-Fi opening http://<lan-ip>:8000 is neither, and subtle would
 * simply be undefined there. This device-pairing flow's whole point is
 * working from a phone over plain LAN Wi-Fi, so the signing has to work
 * without it. Verified byte-for-byte against Python's hashlib/hmac and
 * against RFC 4231's HMAC-SHA256 test vectors before shipping.
 * ------------------------------------------------------------------- */

function rightRotate(x, n) {
  return ((x >>> n) | (x << (32 - n))) >>> 0;
}

const SHA256_K = [
  0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
  0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
  0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
  0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
  0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
  0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
  0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
  0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2,
];

function sha256(bytes) {
  let h0=0x6a09e667,h1=0xbb67ae85,h2=0x3c6ef372,h3=0xa54ff53a,
      h4=0x510e527f,h5=0x9b05688c,h6=0x1f83d9ab,h7=0x5be0cd19;

  const bitLen = bytes.length * 8;
  let paddedLen = bytes.length + 1;
  while (paddedLen % 64 !== 56) paddedLen++;
  paddedLen += 8;

  const padded = new Uint8Array(paddedLen);
  padded.set(bytes);
  padded[bytes.length] = 0x80;
  const dv = new DataView(padded.buffer);
  // 64-bit big-endian bit-length; high 32 bits are always 0 for anything
  // under 512 MB, which covers every real capture (GV_MAX_IMAGE_UPLOAD_BYTES
  // caps uploads at a few MB).
  dv.setUint32(paddedLen - 4, bitLen >>> 0, false);
  dv.setUint32(paddedLen - 8, Math.floor(bitLen / 0x100000000), false);

  const w = new Uint32Array(64);
  for (let chunkStart = 0; chunkStart < paddedLen; chunkStart += 64) {
    for (let i = 0; i < 16; i++) w[i] = dv.getUint32(chunkStart + i * 4, false);
    for (let i = 16; i < 64; i++) {
      const s0 = rightRotate(w[i-15], 7) ^ rightRotate(w[i-15], 18) ^ (w[i-15] >>> 3);
      const s1 = rightRotate(w[i-2], 17) ^ rightRotate(w[i-2], 19) ^ (w[i-2] >>> 10);
      w[i] = (w[i-16] + s0 + w[i-7] + s1) >>> 0;
    }

    let a=h0,b=h1,c=h2,d=h3,e=h4,f=h5,g=h6,hh=h7;
    for (let i = 0; i < 64; i++) {
      const S1 = rightRotate(e,6) ^ rightRotate(e,11) ^ rightRotate(e,25);
      const ch = (e & f) ^ (~e & g);
      const temp1 = (hh + S1 + ch + SHA256_K[i] + w[i]) >>> 0;
      const S0 = rightRotate(a,2) ^ rightRotate(a,13) ^ rightRotate(a,22);
      const maj = (a & b) ^ (a & c) ^ (b & c);
      const temp2 = (S0 + maj) >>> 0;
      hh = g; g = f; f = e; e = (d + temp1) >>> 0;
      d = c; c = b; b = a; a = (temp1 + temp2) >>> 0;
    }
    h0=(h0+a)>>>0; h1=(h1+b)>>>0; h2=(h2+c)>>>0; h3=(h3+d)>>>0;
    h4=(h4+e)>>>0; h5=(h5+f)>>>0; h6=(h6+g)>>>0; h7=(h7+hh)>>>0;
  }

  const out = new Uint8Array(32);
  const outDv = new DataView(out.buffer);
  [h0,h1,h2,h3,h4,h5,h6,h7].forEach((v, i) => outDv.setUint32(i * 4, v, false));
  return out;
}

function concatBytes(...arrays) {
  const total = arrays.reduce((sum, a) => sum + a.length, 0);
  const out = new Uint8Array(total);
  let offset = 0;
  for (const a of arrays) { out.set(a, offset); offset += a.length; }
  return out;
}

function hmacSha256(keyBytes, msgBytes) {
  const blockSize = 64;
  let key = keyBytes;
  if (key.length > blockSize) key = sha256(key);
  if (key.length < blockSize) {
    const padded = new Uint8Array(blockSize);
    padded.set(key);
    key = padded;
  }
  const oKeyPad = new Uint8Array(blockSize);
  const iKeyPad = new Uint8Array(blockSize);
  for (let i = 0; i < blockSize; i++) {
    oKeyPad[i] = key[i] ^ 0x5c;
    iKeyPad[i] = key[i] ^ 0x36;
  }
  const inner = sha256(concatBytes(iKeyPad, msgBytes));
  return sha256(concatBytes(oKeyPad, inner));
}

function toHex(bytes) {
  return Array.from(bytes).map((b) => b.toString(16).padStart(2, "0")).join("");
}

/* One check on load, cheap insurance against ever silently signing wrong:
   if this ever fails (a future edit breaks the hand-rolled SHA-256), refuse
   to let anyone upload with a signature that looks plausible but is not. */
function cryptoSelfTestPasses() {
  const enc = new TextEncoder();
  const emptyOk = toHex(sha256(enc.encode(""))) ===
    "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b85";
  const abcOk = toHex(sha256(enc.encode("abc"))) ===
    "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015a";
  return emptyOk && abcOk;
}

/* -----------------------------------------------------------------------
 * App logic
 * ------------------------------------------------------------------- */

const API_BASE = ""; // same origin as this page
const STORAGE_KEY = "geovision_device_identity";
const NONCE_HEX_CHARS = 16;

function loadIdentity() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch {
    return null;
  }
}

function saveIdentity(identity) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(identity));
  } catch {
    /* private-browsing / storage disabled: identity just won't survive a reload */
  }
}

function randomHex(byteCount) {
  const bytes = new Uint8Array(byteCount);
  crypto.getRandomValues(bytes);
  return toHex(bytes);
}

function getLocation(timeoutMs) {
  return new Promise((resolve) => {
    if (!("geolocation" in navigator)) {
      resolve(null);
      return;
    }
    const timer = setTimeout(() => resolve(null), timeoutMs);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        clearTimeout(timer);
        resolve({
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude,
          accuracy: pos.coords.accuracy,
        });
      },
      () => {
        clearTimeout(timer);
        resolve(null);
      },
      { enableHighAccuracy: true, timeout: timeoutMs, maximumAge: 0 }
    );
  });
}

async function claimCode(code) {
  const response = await fetch(`${API_BASE}/api/v1/pair/claim`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      display_code: code,
      hardware_id: "web-" + randomHex(6),
      firmware_version: "web-1.0",
    }),
  });
  if (!response.ok) {
    const detail = await response.text();
    throw new Error(`Pairing failed (${response.status}). ${detail.slice(0, 200)}`);
  }
  const body = await response.json();
  return {
    device_id: body.device_id,
    device_secret: body.device_secret,
    device_name: body.device_name,
    project_code: body.project_code,
  };
}

async function uploadCapture(identity, file) {
  const imageBytes = new Uint8Array(await file.arrayBuffer());
  const [location, sha256Hex] = await Promise.all([
    getLocation(8000),
    Promise.resolve(toHex(sha256(imageBytes))),
  ]);

  const meta = {
    captured_at: new Date().toISOString(),
    sha256: sha256Hex,
  };
  if (location) {
    meta.latitude = Math.round(location.latitude * 1e6) / 1e6;
    meta.longitude = Math.round(location.longitude * 1e6) / 1e6;
    if (location.accuracy) meta.gps_accuracy_m = Math.round(location.accuracy * 100) / 100;
  }

  const boundary = "----geovisionWeb" + randomHex(8);
  const enc = new TextEncoder();
  const body = concatBytes(
    enc.encode(`--${boundary}\r\n`),
    enc.encode('Content-Disposition: form-data; name="meta"\r\n\r\n'),
    enc.encode(JSON.stringify(meta)),
    enc.encode("\r\n"),
    enc.encode(`--${boundary}\r\n`),
    enc.encode('Content-Disposition: form-data; name="file"; filename="capture.jpg"\r\n'),
    enc.encode("Content-Type: image/jpeg\r\n\r\n"),
    imageBytes,
    enc.encode("\r\n"),
    enc.encode(`--${boundary}--\r\n`)
  );

  const path = "/api/v1/ingest/images";
  const timestamp = Math.floor(Date.now() / 1000);
  const nonce = randomHex(NONCE_HEX_CHARS / 2);
  const bodyHash = toHex(sha256(body));
  const canonical = `POST\n${path}\n${timestamp}\n${nonce}\n${bodyHash}`;
  const signature = toHex(hmacSha256(enc.encode(identity.device_secret), enc.encode(canonical)));

  const response = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: {
      "Content-Type": `multipart/form-data; boundary=${boundary}`,
      "X-Device-Id": identity.device_id,
      "X-Timestamp": String(timestamp),
      "X-Nonce": nonce,
      "X-Signature": signature,
    },
    body,
  });

  if (!response.ok) {
    const detail = await response.text();
    throw new Error(`Upload failed (${response.status}). ${detail.slice(0, 200)}`);
  }
  const result = await response.json();
  return { ...result, hadLocation: Boolean(location) };
}

/* -----------------------------------------------------------------------
 * Rendering — tiny hand-rolled state machine, no framework needed for one page
 * ------------------------------------------------------------------- */

const content = document.getElementById("content");
const fileInput = document.getElementById("file-input");
let identity = loadIdentity();

function render(html) {
  content.innerHTML = html;
}

function renderPaired(message) {
  render(`
    <div class="pill pill-ok">PAIRED</div>
    <div class="device-box">
      <div class="name">${escapeHtml(identity.device_name)}</div>
      <div class="meta">Project ${escapeHtml(identity.project_code)}</div>
    </div>
    ${message || ""}
    <button class="btn-primary" id="capture-btn">📷 Take &amp; Upload Photo</button>
    <button class="btn-secondary" id="forget-btn">Pair a different device</button>
  `);
  document.getElementById("capture-btn").addEventListener("click", () => fileInput.click());
  document.getElementById("forget-btn").addEventListener("click", () => {
    identity = null;
    localStorage.removeItem(STORAGE_KEY);
    renderEntryForm();
  });
}

function renderEntryForm(errorMessage) {
  render(`
    ${errorMessage ? `<div class="error-box">${escapeHtml(errorMessage)}</div>` : ""}
    <p class="subtitle" style="margin-top:-4px;">
      Enter the pairing code shown on the dashboard.
    </p>
    <input type="text" id="code-input" placeholder="K7M2-9XQF" maxlength="10" />
    <button class="btn-primary" id="pair-btn">Pair this device</button>
    <p class="hint">The code is single-use and expires 15 minutes after it's issued.</p>
  `);
  document.getElementById("pair-btn").addEventListener("click", async () => {
    const raw = document.getElementById("code-input").value;
    if (!raw.trim()) return;
    render(`<div class="status-line"><span class="spinner"></span>Pairing…</div>`);
    try {
      identity = await claimCode(raw);
      saveIdentity(identity);
      renderPaired(`<div class="success-box">Paired successfully.</div>`);
    } catch (err) {
      renderEntryForm(err.message);
    }
  });
}

function renderUploadResult(html) {
  render(html);
}

function escapeHtml(text) {
  const div = document.createElement("div");
  div.textContent = String(text);
  return div.innerHTML;
}

fileInput.addEventListener("change", async () => {
  const file = fileInput.files && fileInput.files[0];
  fileInput.value = ""; // allow selecting the same file again next time
  if (!file || !identity) return;

  renderPaired(`<div class="status-line"><span class="spinner"></span>Getting location and uploading…</div>`);
  try {
    const result = await uploadCapture(identity, file);
    const note = result.hadLocation
      ? ""
      : " (location permission was denied or unavailable — uploaded without GPS)";
    renderPaired(`<div class="success-box">Uploaded as ${escapeHtml(result.filename)}${result.duplicate ? " (duplicate — already had this one)" : ""}${note}</div>`);
  } catch (err) {
    renderPaired(`<div class="error-box">${escapeHtml(err.message)}</div>`);
  }
});

async function init() {
  if (!cryptoSelfTestPasses()) {
    render(`<div class="error-box">This page's built-in signing code failed its own self-check and cannot safely sign uploads. Please report this.</div>`);
    return;
  }

  const params = new URLSearchParams(location.search);
  const codeFromUrl = params.get("code");

  if (codeFromUrl) {
    render(`<div class="status-line"><span class="spinner"></span>Pairing…</div>`);
    try {
      identity = await claimCode(codeFromUrl);
      saveIdentity(identity);
      renderPaired(`<div class="success-box">Paired successfully.</div>`);
      return;
    } catch (err) {
      if (identity) {
        renderPaired(`<div class="error-box">Couldn't use the new code (${escapeHtml(err.message)}) — using the device already paired on this phone instead.</div>`);
        return;
      }
      renderEntryForm(err.message);
      return;
    }
  }

  if (identity) {
    renderPaired();
    return;
  }

  renderEntryForm();
}

init();
</script>
</body>
</html>
