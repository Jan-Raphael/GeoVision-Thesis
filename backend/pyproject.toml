[project]
name = "geovision-backend"
version = "0.1.0"
description = "GeoVision backend: FastAPI service for construction monitoring"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Jan Raphael Macabulos" }]

# ---------------------------------------------------------------------------
# DEPENDENCY TOPOLOGY (ADR-011)
#
# Three groups, deliberately separated:
#
#   base            -> the API process. Contains NO torch, NO opencv.
#   [worker]        -> base + geovision-ai (torch, opencv, ultralytics)
#   [dev]           -> tooling
#
# Why: the vault requires that "the API process never runs torch". Splitting
# the dependency sets makes that structurally true rather than a convention
# somebody has to remember, and keeps the API image ~200 MB instead of ~2.5 GB.
# ---------------------------------------------------------------------------
dependencies = [
    # web
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "python-multipart>=0.0.20,<1",
    "websockets>=14,<16",
    # settings & validation
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "email-validator>=2.2,<3",
    # database
    "sqlalchemy[asyncio]>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "alembic>=1.14,<2",
    # cache / queue
    "redis[hiredis]>=5.2,<7",
    "celery>=5.4,<6",
    # object storage
    "boto3>=1.35,<2",
    # security
    "argon2-cffi>=23.1,<26",
    "python-jose[cryptography]>=3.3,<4",
    # reports & qr
    "reportlab>=4.2,<5",
    "matplotlib>=3.9,<4",
    "qrcode[pil]>=8,<9",
    # misc
    "python-json-logger>=3.2,<4",
    "slowapi>=0.1.9,<1",
    "tzdata>=2024.2",              # IANA zones - required on Windows
]

[project.optional-dependencies]
# Installed only in the Celery worker image. `geovision-ai` is resolved from
# the sibling directory via [tool.uv.sources] below.
worker = ["geovision-ai"]

dev = [
    # The worker package. Present in dev so the aggregation and inference paths
    # are testable; deliberately ABSENT from the base group, which is what the
    # API image installs. Developers and CI legitimately install more than
    # production does - and the `no-torch-in-api` import contract, which
    # inspects app.api's import graph rather than what happens to be installed,
    # is what actually keeps torch out of the API process (ADR-011).
    "geovision-ai",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "pytest-cov>=6,<7",
    "httpx>=0.28,<1",
    "factory-boy>=3.3,<4",
    "freezegun>=1.5,<2",
    "ruff>=0.9,<1",
    "mypy>=1.14,<2",
    "import-linter>=2.1,<3",
    "pre-commit>=4,<5",
    "types-python-jose>=3.3,<4",
    "boto3-stubs[s3]>=1.35,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# The AI package is a sibling directory, installed editable so changes there
# are picked up by the worker without a reinstall.
[tool.uv.sources]
geovision-ai = { path = "../ai", editable = true }

# ---------------------------------------------------------------------------
# Ruff - replaces black + isort + flake8 (ADR-012)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "C4",      # comprehensions
    "SIM",     # simplify
    "PTH",     # prefer pathlib
    "ASYNC",   # async antipatterns
    "S",       # bandit security rules
    "DTZ",     # naive-datetime ban - the whole schema is TIMESTAMPTZ/UTC
    "T20",     # no stray print()
    "RUF",
    "D",       # docstrings are a project requirement
]
ignore = [
    "D104",   # missing docstring in public package
    "D203",   # conflicts with D211
    "D213",   # conflicts with D212
    "E501",   # line length handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S105", "S106"]   # asserts and fake creds are fine in tests
"alembic/**" = ["D", "N999"]
"**/__init__.py" = ["D104", "F401"]
# CLI scripts talk to a human on stdout; S311 covers non-crypto randomness used
# only to make seed data look realistic; S105/S106 are the obviously-fake
# development credentials the seed writes (real ones come from .env).
"scripts/**" = ["T201", "S311", "S105", "S106", "PLR0915"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["alembic/versions/"]

# These ship without type stubs or a py.typed marker. Listed explicitly rather
# than using a blanket ignore_missing_imports, so a genuinely missing dependency
# still fails loudly.
# `ai.*` is the worker-only package (the `[worker]` extra). It is deliberately
# absent from the base and dev environments so the API image never gains torch
# (ADR-011), which means mypy cannot resolve it here - and that absence is the
# boundary working, not a missing dependency.
[[tool.mypy.overrides]]
module = ["ai.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "asyncpg.*",
    "celery.*",
    "slowapi.*",
    "qrcode.*",
    "reportlab.*",
    "matplotlib.*",
    "jose.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Both loop scopes must be "session" so async fixtures and the tests that use
# them share one event loop. An asyncpg connection is bound to the loop that
# created it, so a session-scoped engine used from a per-test loop fails with
# "another operation is in progress" - which is exactly what happened before
# these two lines existed.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast, no external services",
    "integration: requires postgres/redis/minio (run `make up` first)",
    "slow: takes more than a few seconds",
    "e2e: full stack end to end",
]
filterwarnings = [
    "error::DeprecationWarning:app.*",
    "ignore::DeprecationWarning:celery.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*", "*/__init__.py", "app/main.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
