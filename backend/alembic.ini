; GeoVision - Alembic configuration
;
; The database URL is deliberately NOT stored here. It is assembled from
; environment variables in alembic/env.py via app.core.config.Settings, so the
; credentials live in exactly one place and never reach version control.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

; Revision filenames sort chronologically and name their module, e.g.
;   2026_08_13_1430-a1b2c3d4e5f6_m02_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

; Timestamps in filenames are UTC, matching everything else in this project.
timezone = UTC

[post_write_hooks]
; Auto-format generated migrations so they pass lint without hand-editing.
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
