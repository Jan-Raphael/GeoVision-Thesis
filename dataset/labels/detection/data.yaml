# YOLOv8 dataset config (Module-08-YOLO-Detection.md). Class indices are FROZEN once trained —
# reordering silently relabels every detection a checkpoint has ever produced.
#
# NOT YET USABLE: no bounding-box annotation has started (dataset/labels/ holds only this file
# as of 2026-08-28). The `train`/`val`/`test` paths below are a placeholder layout — confirm or
# adjust them once CVAT export settles on an actual directory structure, before the first real
# `train_detector.py` run.

path: ../../processed/detection
train: images/train
val: images/validation
test: images/test

names:
  0: wall
  1: beam
  2: column
  3: rebar
  4: roofing
  5: window
  6: door
  7: tile
  8: railing
  9: lighting
